[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attune-forms"
version = "0.13.0"
description = "Dynamic forms and command workspaces: validated multi-surface interaction documents for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Smart AI Memory", email = "admin@smartaimemory.com"}]
keywords = ["forms", "elicitation", "claude", "agents", "socratic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "structlog>=24.0.0,<27.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.23.0,<2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.20",
    "mcp>=1.23.0,<2.0",
]

[project.scripts]
attune-forms-mcp = "attune_forms.mcp_server:main"
attune-forms-preview = "attune_forms.preview:main"

[project.urls]
Homepage = "https://github.com/Smart-AI-Memory/attune-forms"
Repository = "https://github.com/Smart-AI-Memory/attune-forms"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
attune_forms = ["templates/*.json", "semantic_tokens.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
